# Claude Notch — tmux runs *inside* the chat panel's terminal. It is not a
# multiplexer here: it is what lets the "+" bar type into Claude Code
# (tmux send-keys) and what keeps the session alive when the panel is closed.
# No prefix, no status line — nothing in between you and the agent.
set -g prefix None
unbind C-b
set -g status off
set -s escape-time 0
set -g mouse on
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
set -g set-titles off
